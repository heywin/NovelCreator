name: Validate collaboration workflow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated regression tests
        run: python -B -m unittest discover -s verification -v
      - name: Check whitespace
        run: git show --format= --check HEAD
